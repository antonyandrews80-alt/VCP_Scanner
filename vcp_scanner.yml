name: Send Telegram Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Send Telegram Summary
        run: |
          # Find the most recent Telegram summary file
          SUMMARY_FILE=$(ls -t *_Telegram_Summary.txt 2>/dev/null | head -n 1)
          
          if [ -f "$SUMMARY_FILE" ]; then
            echo "Found summary file: $SUMMARY_FILE"
            
            # Read the summary
            SUMMARY=$(cat "$SUMMARY_FILE")
            
            # Send to Telegram
            curl -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -H 'Content-Type: application/json' \
              -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": $(echo "$SUMMARY" | jq -Rs .), \"parse_mode\": \"Markdown\"}"
            
            echo "✓ Summary sent to Telegram"
          else
            echo "⚠ No summary file found"
            
            curl -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -H 'Content-Type: application/json' \
              -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"VCP Scanner completed - check GitHub for results\"}"
          fi
