name: VCP Daily Scanner

on:
  # Auto-run when you push today's CSV to the repo
  push:
    paths:
      - '*_Screener_1.csv'
      - 'data/*_Screener_1.csv'
      - 'csv/*_Screener_1.csv'

  # Scheduled run every weekday 9:00 PM IST (3:30 PM UTC)
  # CSV must already be in repo by this time
  schedule:
    - cron: '30 15 * * 1-5'

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VCP Scanner
        env:
          CLAUDE_API_KEY:   ${{ secrets.CLAUDE_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python vcp_scanner.py

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=VCP Scanner failed. Check GitHub Actions logs." \
            -d "parse_mode=HTML"
