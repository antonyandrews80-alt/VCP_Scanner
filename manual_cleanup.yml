name: Manual Cleanup - Delete Old Files

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Delete old files
        run: |
          echo "🗑️ Deleting files older than current week..."
          
          # Keep only files from last 2 days (adjust as needed)
          find . -maxdepth 1 -type f \( \
            -name "2026-05-0*" -o \
            -name "2026-05-10*" -o \
            -name "2026-05-11*" -o \
            -name "2026-05-12*" \
          \) -delete
          
          # Or delete all old CSVs except latest
          # Uncomment if you want to keep ONLY the latest files
          # ls -t *_All_Scans.csv | tail -n +2 | xargs rm -f
          # ls -t *_Telegram_Summary.txt | tail -n +2 | xargs rm -f
          
          echo "✅ Cleanup complete!"
      
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Manual cleanup: Remove old files"
          git push
